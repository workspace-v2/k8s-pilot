apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app.kubernetes.io/name: mysql }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mysql }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mysql
          image: mysql:8.0.46
          args: ["--innodb-buffer-pool-size=64M", "--performance-schema=OFF"]
          env:
            - { name: MYSQL_DATABASE, value: bangjjack_reuse }
            - { name: MYSQL_USER, value: bangjjack }
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.credentialsSecret }}, key: DB_PASSWORD }
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.credentialsSecret }}, key: MYSQL_ROOT_PASSWORD }
          ports:
            - { name: mysql, containerPort: 3306 }
          readinessProbe:
            tcpSocket: { port: mysql }
          resources:
            requests: { cpu: 150m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  selector: { app.kubernetes.io/name: mysql }
  ports:
    - { name: mysql, port: 3306, targetPort: mysql }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: redis }
  template:
    metadata:
      labels: { app.kubernetes.io/name: redis }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: redis:7.4-alpine
          command: ["sh", "-ec", 'exec redis-server --save "" --appendonly no --requirepass "$REDIS_PASSWORD"']
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.credentialsSecret }}, key: REDIS_PASSWORD }
          ports:
            - { name: redis, containerPort: 6379 }
          readinessProbe:
            tcpSocket: { port: redis }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: { app.kubernetes.io/name: redis }
  ports:
    - { name: redis, port: 6379, targetPort: redis }
