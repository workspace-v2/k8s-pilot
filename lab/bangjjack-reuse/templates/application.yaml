apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}
      annotations:
        gitops.lab/revision: {{ required "lab.revision is required" .Values.lab.revision | quote }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        k8s-pilot/worker: "true"
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret }}
      containers:
        - name: app
          image: {{ required "image.ref is required" .Values.image.ref | quote }}
          ports:
            - { name: management, containerPort: 8081 }
          env:
            {{- range $key := list "DB_PASSWORD" "REDIS_PASSWORD" "JWT_ACCESS" "DEV_SECRET" "GOOGLE_CLIENT_ID" "GOOGLE_CLIENT_SECRET" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef: { name: {{ $.Values.credentialsSecret }}, key: {{ $key }} }
            {{- end }}
            - { name: SPRING_PROFILES_ACTIVE, value: dev }
            - { name: DB_URL, value: "jdbc:mysql://mysql:3306/bangjjack_reuse?allowPublicKeyRetrieval=true&sslMode=DISABLED" }
            - { name: DB_USER, value: bangjjack }
            - { name: REDIS_HOST, value: redis }
            - { name: SERVER_URI, value: "http://localhost:8080" }
            - { name: FRONT_URI, value: "http://localhost:5173" }
            - { name: GOOGLE_REDIRECT_URI, value: "http://localhost:8080/auth/login/google" }
            - { name: AI_MATCH_API_BASE_URL, value: "http://127.0.0.1:9999" }
            - { name: TRACING_EXPORT_ENABLED, value: "false" }
            - { name: JAVA_OPTS, value: "-Xmx384m -XX:ActiveProcessorCount=2" }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: management }
          resources:
            requests: { cpu: 150m, memory: 384Mi }
            limits: { memory: 640Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}
  ports:
    - { name: management, port: 8081, targetPort: management }
