{{- range $role := list "active" "preview" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $role }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/name: blue-green-lab
  ports:
    - { name: http, port: 80, targetPort: http }
{{- end }}
