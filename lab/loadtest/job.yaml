apiVersion: batch/v1
kind: Job
metadata:
  generateName: k6-lab-
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 150
  ttlSecondsAfterFinished: 1800
  template:
    spec:
      nodeName: k8s-pilot-control
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:1.0.0
          args: [run, /scripts/smoke.js]
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
          volumeMounts:
            - { name: script, mountPath: /scripts, readOnly: true }
      volumes:
        - name: script
          configMap: { name: community-service-k6 }
