apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: prometheus
  namespace: argocd

spec:
  project: default

  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus
      targetRevision: "29.20.1"
      helm:
        releaseName: prometheus
        valueFiles:
          - $values/argocd/values/prometheus-values.yaml

    - repoURL: https://github.com/workspace-v2/k8s-pilot.git
      targetRevision: 55ed8ccdccd266145d1395da962d846e0bd52a71
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
