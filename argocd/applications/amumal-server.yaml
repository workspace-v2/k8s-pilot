apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: amumal-server
  namespace: argocd
spec:
  project: default

  source:
    # 백엔드 Helm chart는 이 저장소의 chart 디렉토리에 정의
    repoURL: https://github.com/pattie-assignments/k8s-pilot.git
    targetRevision: main
    path: chart
    helm:
      parameters:
        - name: storage.nfsServer
          value: "172.31.12.37"
          forceString: true
        - name: mysql.enabled
          value: "false"
        - name: mysql.host
          value: "172.31.2.203"
          forceString: true
        - name: redis.enabled
          value: "false"
        - name: redis.host
          value: "172.31.2.203"
          forceString: true

  destination:
    server: https://kubernetes.default.svc
    namespace: community-service

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
