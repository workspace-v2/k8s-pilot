# Traefik Helm chart 템플릿에 주입할 values만 정의
deployment:
  replicas: 1

service:
  spec:
    # 앞단 EC2가 워커 노드의 고정 포트로 접근하도록 Traefik Service를 NodePort로 생성
    type: NodePort

ports:
  web:
    # HTTP 요청을 받을 NodePort
    nodePort: 32080
  websecure:
    # HTTPS 요청을 받을 NodePort
    nodePort: 32443

ingressClass:
  # IngressClass라는 Kubernetes 리소스를 생성
  enabled: true
  # 애플리케이션 Ingress에서 ingressClassName: traefik 으로 참조
  name: traefik

  # ingressClassName이 없는 Ingress까지 Traefik이 자동 처리하지 않도록 설정
  isDefaultClass: false

providers:
  kubernetesIngress:
    # 표준 Kubernetes Ingress 리소스를 감시
    enabled: true
    publishedService:
      enabled: false
    ingressEndpoint:
      hostname: api.pattie.cloud

  kubernetesCRD:
    # IngressRoute, Middleware 같은 Traefik 전용 리소스는 지금 사용하지 않음
    enabled: false
