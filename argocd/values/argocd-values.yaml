applicationSet:
  nodeSelector:
    monitoring: "yes"

controller:
  nodeSelector:
    monitoring: "yes"

repoServer:
  nodeSelector:
    monitoring: "yes"

server:
  extraArgs:
    - --insecure

  ingress:
    enabled: false

  nodeSelector:
    monitoring: "yes"

  service:
    type: NodePort
    nodePortHttp: 32081
    nodePortHttps: 32481
