apiVersion: v1
kind: PersistentVolume
metadata:
  name: community-service-uploads-rwx
spec:
  capacity:
    storage: 1Gi
  accessModes: [ReadWriteMany]
  storageClassName: ""
  persistentVolumeReclaimPolicy: Retain
  claimRef:
    namespace: {{ .Release.Namespace }}
    name: community-service-uploads-rwx
  mountOptions: [nfsvers=4.1]
  nfs:
    server: {{ required "storage.nfsServer must be the control plane private IP" .Values.storage.nfsServer | quote }}
    path: {{ .Values.storage.path | quote }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: community-service-uploads-rwx
spec:
  volumeName: community-service-uploads-rwx
  storageClassName: ""
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 1Gi
