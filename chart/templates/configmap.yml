apiVersion: v1
kind: ConfigMap
metadata:
  name: community-service
data:
  SPRING_PROFILES_ACTIVE: pilot
  MANAGEMENT_SERVER_PORT: "3001"
  MANAGEMENT_ENDPOINTS_WEB_BASEPATH: /
  MANAGEMENT_ENDPOINTS_WEB_PATHMAPPING_HEALTH: v1/actuator/health
  MANAGEMENT_ENDPOINTS_WEB_PATHMAPPING_PROMETHEUS: actuator/prometheus
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus
  MANAGEMENT_METRICS_DISTRIBUTION_PERCENTILESHISTOGRAM_HTTP_SERVER_REQUESTS: "true"
  DB_HOST: {{ .Values.mysql.host | quote }}
  DB_PORT: {{ .Values.mysql.port | quote }}
  DB_NAME: {{ .Values.mysql.database | quote }}
  DB_USERNAME: {{ .Values.mysql.username | quote }}
  REDIS_HOST: {{ .Values.redis.host | quote }}
  REDIS_PORT: {{ .Values.redis.port | quote }}
  REDIS_SSL_ENABLED: "false"
  SEARCH_ENGINE: mysql
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=65"
  LOGGING_LEVEL_ORG_HIBERNATE_SQL: INFO
