{{- range $store := list
  (dict "name" "mysql" "image" "mysql:8.0" "port" 3306 "disk" "5Gi" "path" "/var/lib/mysql" "enabled" .Values.mysql.enabled)
  (dict "name" "redis" "image" "redis:7.2-alpine" "port" 6379 "disk" "1Gi" "path" "/data" "enabled" .Values.redis.enabled)
}}
{{- if $store.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $store.name }}-data
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/compare-options: IgnoreExtraneous
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: {{ $store.disk }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $store.name }}
spec:
  selector: { app: {{ $store.name }} }
  ports:
    - { port: {{ $store.port }}, targetPort: {{ $store.port }} }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $store.name }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: {{ $store.name }} }
  template:
    metadata:
      labels: { app: {{ $store.name }} }
    spec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      automountServiceAccountToken: false
      containers:
        - name: {{ $store.name }}
          image: {{ $store.image | quote }}
          ports:
            - { containerPort: {{ $store.port }} }
          env:
            {{- if eq $store.name "mysql" }}
            - { name: MYSQL_DATABASE, value: {{ $.Values.mysql.database | quote }} }
            - { name: MYSQL_USER, value: {{ $.Values.mysql.username | quote }} }
            {{- end }}
            {{- $keys := dict "MYSQL_PASSWORD" "DB_PASSWORD" "MYSQL_ROOT_PASSWORD" "MYSQL_ROOT_PASSWORD" }}
            {{- if eq $store.name "redis" }}{{- $keys = dict "REDIS_PASSWORD" "REDIS_PASSWORD" }}{{- end }}
            {{- range $name, $key := $keys }}
            - name: {{ $name }}
              valueFrom:
                secretKeyRef: { name: {{ $.Values.existingSecret | quote }}, key: {{ $key }} }
            {{- end }}
          {{- if eq $store.name "redis" }}
          command:
            - sh
            - -ec
            - exec redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"
          {{- end }}
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                {{- if eq $store.name "mysql" }}
                - MYSQL_PWD="$MYSQL_PASSWORD" mysql --protocol TCP -h127.0.0.1 -u "$MYSQL_USER" "$MYSQL_DATABASE" -e "SELECT 1" >/dev/null
                {{- else }}
                - REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping | grep -qx PONG
                {{- end }}
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - { name: data, mountPath: {{ $store.path }} }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: {{ $store.name }}-data }
{{- end }}
{{- end }}
