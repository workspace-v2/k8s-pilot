apiVersion: v1
kind: Service
metadata:
  name: community-service
spec:
  type: {{ .Values.service.type | quote }}
  selector: { app: community-service }
  ports:
    - { port: {{ .Values.service.port }}, targetPort: http }
---
apiVersion: v1
kind: Service
metadata:
  name: community-service-management
spec:
  type: ClusterIP
  selector: { app: community-service }
  ports:
    - { name: management, port: 3001, targetPort: management }
